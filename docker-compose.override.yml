# Local-development overrides — auto-loaded by `docker compose up` when this
# file sits next to docker-compose.yml. Dokploy invokes compose with an
# explicit `-f docker-compose.yml`, so this file is NOT applied in production.
#
# Adds host-port mappings so you can curl http://localhost:3001, open the
# Vite-built frontend at http://localhost:5173, and connect a local psql to
# Postgres at localhost:5432 — without exposing any of those publicly in prod.

services:
  postgres:
    ports:
      - '5432:5432'

  backend:
    ports:
      - '${PORT:-3001}:${PORT:-3001}'
      - '${WS_PORT:-3002}:${WS_PORT:-3002}'

  frontend:
    ports:
      - '5173:80'
